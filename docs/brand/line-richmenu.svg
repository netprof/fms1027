<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <!-- LINE rich menu, large size. Top row: three tap areas of 833 px;
       bottom row: two of 1250 px. The bounds live in scripts/line-richmenu.ts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D24A2C"/>
      <stop offset="1" stop-color="#AD3220"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A42F1E"/>
      <stop offset="1" stop-color="#862416"/>
    </linearGradient>
    <style>
      .label { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: 700; font-size: 112px; fill: #FFFFFF; letter-spacing: 8px; }
      .note { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-weight: 400; font-size: 54px; fill: #FBEBDD; fill-opacity: 0.92; letter-spacing: 3px; }
    </style>
  </defs>
  <rect width="2500" height="843" fill="url(#bg)"/>
  <rect y="843" width="2500" height="843" fill="url(#bg2)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4">
    <line x1="833" y1="90" x2="833" y2="753"/>
    <line x1="1667" y1="90" x2="1667" y2="753"/>
    <line x1="1250" y1="933" x2="1250" y2="1596"/>
  </g>

  <!-- 我要訂餐: bento box -->
  <g transform="translate(416 270)">
    <circle r="165" fill="#FFFFFF" fill-opacity="0.14"/>
    <g stroke="#F2C14E" stroke-linecap="round" stroke-width="12">
      <line x1="-96" y1="-104" x2="100" y2="-120"/>
      <line x1="-96" y1="-82" x2="100" y2="-96"/>
    </g>
    <rect x="-110" y="-62" width="220" height="150" rx="24" fill="#FFFFFF"/>
    <rect x="-94" y="-46" width="106" height="118" rx="12" fill="#FBEBDD"/>
    <rect x="26" y="-46" width="68" height="52" rx="10" fill="#FBEBDD"/>
    <rect x="26" y="20" width="68" height="52" rx="10" fill="#FBEBDD"/>
    <circle cx="-41" cy="13" r="24" fill="#E9A23B"/>
    <path d="M38 -10c6-20 38-22 44 0z" fill="#6DA34D"/>
    <rect x="36" y="36" width="48" height="20" rx="10" fill="#C8452C"/>
  </g>
  <text class="label" x="416" y="590" text-anchor="middle">我要訂餐</text>
  <text class="note" x="416" y="690" text-anchor="middle">傳訊息就能訂</text>

  <!-- 查詢訂單: clipboard -->
  <g transform="translate(1250 270)">
    <circle r="165" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="-82" y="-104" width="164" height="206" rx="20" fill="#FFFFFF"/>
    <rect x="-40" y="-122" width="80" height="40" rx="12" fill="#F2C14E"/>
    <g stroke="#C8452C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="-52,-38 -38,-24 -14,-50"/>
      <polyline points="-52,18 -38,32 -14,6"/>
    </g>
    <g stroke="#E3C9B6" stroke-width="12" stroke-linecap="round">
      <line x1="8" y1="-36" x2="54" y2="-36"/>
      <line x1="8" y1="20" x2="54" y2="20"/>
      <line x1="-52" y1="70" x2="54" y2="70"/>
    </g>
  </g>
  <text class="label" x="1250" y="590" text-anchor="middle">查詢訂單</text>
  <text class="note" x="1250" y="690" text-anchor="middle">看下一餐訂了什麼</text>

  <!-- 截止時間: clock -->
  <g transform="translate(2083 270)">
    <circle r="165" fill="#FFFFFF" fill-opacity="0.14"/>
    <circle r="108" fill="#FFFFFF"/>
    <g fill="#E3C9B6">
      <circle cx="0" cy="-84" r="8"/><circle cx="84" cy="0" r="8"/>
      <circle cx="0" cy="84" r="8"/><circle cx="-84" cy="0" r="8"/>
    </g>
    <g stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-62" stroke="#C8452C" stroke-width="14"/>
      <line x1="0" y1="0" x2="-24" y2="-42" stroke="#C8452C" stroke-width="14"/>
    </g>
    <circle r="12" fill="#F2C14E"/>
  </g>
  <text class="label" x="2083" y="590" text-anchor="middle">截止時間</text>
  <text class="note" x="2083" y="690" text-anchor="middle">午 11:00・晚 16:00</text>

  <!-- 上月帳單: receipt -->
  <g transform="translate(625 1113)">
    <circle r="165" fill="#FFFFFF" fill-opacity="0.14"/>
    <path d="M-80 -112h160v224l-27 -18 -26 18 -27 -18 -27 18 -26 -18 -27 18z" fill="#FFFFFF"/>
    <g stroke="#E3C9B6" stroke-width="12" stroke-linecap="round">
      <line x1="-48" y1="-62" x2="48" y2="-62"/>
      <line x1="-48" y1="-24" x2="48" y2="-24"/>
      <line x1="-48" y1="14" x2="12" y2="14"/>
    </g>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="64" fill="#C8452C">$</text>
  </g>
  <text class="label" x="625" y="1433" text-anchor="middle">上月帳單</text>
  <text class="note" x="625" y="1533" text-anchor="middle">上個月的份數與金額</text>

  <!-- 本月帳單: calendar -->
  <g transform="translate(1875 1113)">
    <circle r="165" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="-104" y="-88" width="208" height="192" rx="22" fill="#FFFFFF"/>
    <path d="M-104 -50v-16a22 22 0 0 1 22 -22h164a22 22 0 0 1 22 22v16z" fill="#F2C14E"/>
    <g stroke="#C8452C" stroke-width="14" stroke-linecap="round">
      <line x1="-52" y1="-112" x2="-52" y2="-72"/>
      <line x1="52" y1="-112" x2="52" y2="-72"/>
    </g>
    <g fill="#E3C9B6">
      <rect x="-70" y="-24" width="36" height="30" rx="6"/><rect x="-18" y="-24" width="36" height="30" rx="6"/><rect x="34" y="-24" width="36" height="30" rx="6"/>
      <rect x="-70" y="28" width="36" height="30" rx="6"/><rect x="-18" y="28" width="36" height="30" rx="6"/>
    </g>
    <rect x="34" y="28" width="36" height="30" rx="6" fill="#C8452C"/>
  </g>
  <text class="label" x="1875" y="1433" text-anchor="middle">本月帳單</text>
  <text class="note" x="1875" y="1533" text-anchor="middle">本月截至今天的金額</text>
</svg>
